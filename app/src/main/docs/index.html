window.DP_CONTENT = {
'A1-M02':{brief:'Beschreibe deinen normalen Tag und sprich über Zeiten und Gewohnheiten.',read:'Anna steht um 6:30 Uhr auf. Sie arbeitet von 8 bis 16 Uhr. Am Abend trifft sie manchmal Freunde und am Wochenende schläft sie länger.',listen:'Daniel beginnt um acht Uhr. Nach der Arbeit geht er zweimal pro Woche zum Schwimmen.',speak:'Erzähl von deinem normalen Tag. Wann stehst du auf? Was machst du nach der Arbeit?',write:'Schreibe 5–6 Sätze über deinen Alltag.',final:'Dein Kurs beginnt morgen früher. Erkläre, was sich an deinem Tag ändert.'},
'A1-M03':{brief:'Sprich über deine Familie und wichtige Personen.',read:'Lena hat einen Bruder und eine Schwester. Ihr Bruder heißt Paul und wohnt in Hamburg. Ihre Schwester studiert in Köln.',listen:'Tom erzählt von seiner Familie und sagt, wo seine Eltern und Geschwister wohnen.',speak:'Beschreibe deine Familie oder eine wichtige Person.',write:'Schreibe 5–6 Sätze über deine Familie.',final:'Eine neue Person fragt dich nach deiner Familie. Antworte und stelle eine Frage.'},
'A1-M04':{brief:'Bestelle etwas im Café und reagiere auf ein kleines Problem.',read:'Café Morgen: Kaffee 3 €, Tee 2,50 €, Kuchen 4 €. Heute gibt es keinen Apfelkuchen.',listen:'Eine Kundin möchte Kaffee und Kuchen. Der Apfelkuchen ist leider nicht verfügbar.',speak:'Bestelle ein Getränk und etwas zu essen.',write:'Schreibe eine kurze Nachricht: Was möchtest du im Café bestellen?',final:'Dein gewünschter Kuchen ist nicht da. Frage nach einer Alternative.'},
'A1-M05':{brief:'Kaufe ein Kleidungsstück und frage nach Preis, Größe und Farbe.',read:'T-Shirt: blau, rot und schwarz. Größen S, M, L. Preis 20 €. Größe M in Blau ist ausverkauft.',listen:'Ein Kunde sucht ein schwarzes T-Shirt in Größe M.',speak:'Frage nach Größe, Farbe und Preis.',write:'Schreibe eine kurze Nachricht über einen Einkauf.',final:'Deine gewünschte Größe ist nicht verfügbar. Frage nach einer anderen Möglichkeit.'},
'A1-M06':{brief:'Beschreibe deine Wohnung und sage, wo Dinge sind.',read:'Die Wohnung hat ein Wohnzimmer, ein Schlafzimmer und eine Küche. Der Tisch steht in der Küche. Das Sofa steht neben dem Fenster.',listen:'Maria beschreibt ihr Zimmer und sagt, wo ihr Schreibtisch steht.',speak:'Beschreibe einen Raum.',write:'Schreibe 5–6 Sätze über deine Wohnung.',final:'Ein Freund fragt: „Wo ist die Lampe?“ Antworte und erkläre den Ort.'},
'A1-M07':{brief:'Frage nach dem Weg und gib einfache Richtungen.',read:'Der Bahnhof ist neben dem Rathaus. Die Apotheke ist gegenüber dem Bahnhof. Der Supermarkt ist hinter dem Rathaus.',listen:'„Gehen Sie geradeaus, dann links. Die Bank ist neben dem Café.“',speak:'Erkläre einen einfachen Weg.',write:'Schreibe kurze Wegbeschreibung zum Bahnhof.',final:'Die normale Straße ist geschlossen. Gib einen einfachen alternativen Weg.'},
'A1-M08':{brief:'Am ersten Arbeitstag Informationen verstehen und um Hilfe bitten.',read:'Arbeitsbeginn 8 Uhr. Pause um 12 Uhr. Die Besprechung ist in Raum 204. Das Büro ist im zweiten Stock.',listen:'„Zuerst gehen Sie zur Rezeption. Dann warten Sie in Raum 204.“',speak:'Erkläre, was du am ersten Arbeitstag machen musst.',write:'Schreibe deinem Kollegen eine kurze Nachricht.',final:'Du hast eine Anweisung nicht verstanden. Bitte um Wiederholung.'},
'A1-M09':{brief:'In einer Apotheke einen einfachen Bedarf erklären.',read:'Apotheke: Montag–Freitag 8–18 Uhr, Samstag 9–13 Uhr. Die Adresse ist Hauptstraße 10.',listen:'Eine Person erklärt, dass sie Hilfe braucht und fragt nach den Öffnungszeiten.',speak:'Erkläre einen einfachen Bedarf und bitte um Hilfe.',write:'Schreibe eine kurze Nachricht mit einer einfachen Frage.',final:'Du verstehst die Antwort nicht. Bitte um Wiederholung oder Erklärung.'},
'A1-M10':{brief:'Am Wochenende einen einfachen Plan machen und eine gemeinsame Entscheidung treffen.',read:'Kino Samstag 19 Uhr. Park Sonntag 11 Uhr. Museum Samstag 14 Uhr.',listen:'Zwei Freunde sprechen über das Wochenende und einigen sich auf eine Aktivität.',speak:'Sag, was du am Wochenende machen möchtest.',write:'Schreibe einem Freund eine kurze Nachricht mit einem Vorschlag.',final:'Dein Freund möchte etwas anderes. Mach einen Gegenvorschlag und einigen Sie sich.'},
'A1-M11':{brief:'Am Bahnhof Informationen finden und ein einfaches Ticket kaufen.',read:'Zug nach Köln: 10:20, Gleis 4. Zug nach Bonn: 10:45, Gleis 2.',listen:'„Der Zug nach Köln fährt um 10:20 Uhr von Gleis 4.“',speak:'Sage, wohin du fahren möchtest und frage nach Informationen.',write:'Schreibe eine kurze Nachricht mit deinem Reiseziel.',final:'Dein Zug fährt von einem anderen Gleis. Frage nach Hilfe.'},
'A1-M12':{brief:'Einen einfachen Termin vereinbaren und bestätigen.',read:'Das Büro ist Montag bis Freitag von 9 bis 16 Uhr geöffnet.',listen:'Eine Person fragt nach einem Termin am Dienstag und wählt 15 Uhr.',speak:'Sage, wann du Zeit hast.',write:'Schreibe eine kurze Termin-Nachricht.',final:'Die gewünschte Zeit ist nicht frei. Wähle eine andere Zeit.'},
'A2-M01':{brief:'Beschreibe deinen Alltag, erkläre Vorlieben und vergleiche Erfahrungen.',read:'Maria arbeitet in einem kleinen Hotel. Sie beginnt um 8 Uhr, besucht zweimal pro Woche einen Deutschkurs und trifft am Wochenende Freunde. Sie mag Köln, findet die Stadt aber manchmal zu laut.',listen:'Daniel arbeitet in Bonn. Er fährt am Wochenende gern Fahrrad und bleibt bei schlechtem Wetter zu Hause.',speak:'Erzähle von deinem Alltag und erkläre eine Vorliebe.',write:'Schreibe 60–80 Wörter über deinen Alltag.',final:'Morgen musst du früher anfangen. Erkläre, was sich ändert und warum.'},
'A2-M02':{brief:'Erzähle von einem vergangenen Ereignis und erkläre, was passiert ist.',read:'Anna wollte am Samstag mit dem Zug fahren. Der Zug war schon weg. Sie wartete fast eine Stunde und traf ihre Freundin später in der Stadt.',listen:'Lukas wollte Fahrrad fahren, aber es begann zu regnen. Deshalb fuhr er nach Hause und sah einen Film.',speak:'Erzähle von einem Tag in der letzten Woche.',write:'Schreibe 70–90 Wörter über einen besonderen Tag.',final:'Dein geplanter Zug fällt aus. Erkläre das Problem und beschreibe deinen neuen Plan.'},
'A2-M03':{brief:'Vergleiche Reiseangebote, plane eine Reise und entscheide gemeinsam.',read:'Köln: Zug 45 €, Hotel 120 €, Frühstück inklusive. Hamburg: Bus 35 €, Hotel 90 €, Frühstück 10 €. Bonn: Zug 30 €, Hotel 80 €, Frühstück inklusive.',listen:'Anna möchte Köln, Lukas findet Bonn praktischer. Sie vergleichen Preis und Lage und entscheiden sich gemeinsam.',speak:'Welche Reise würdest du wählen? Begründe deine Entscheidung.',write:'Schreibe 70–90 Wörter über deinen Reiseplan.',final:'Das gewählte Hotel ist ausgebucht. Schlage eine Alternative vor und begründe sie.'},
'A2-M04':{brief:'Erkläre ein Problem, bitte um Hilfe und reagiere auf eine Lösung.',read:'Hotel Adler: Rezeption bis 23 Uhr, Frühstück 7–10 Uhr, WLAN kostenlos. Probleme können an der Rezeption gemeldet werden.',listen:'Ein Gast hat ein Heizungsproblem. Ein anderes Zimmer wird angeboten.',speak:'Erkläre ein Problem in einem Hotel.',write:'Schreibe 60–80 Wörter an die Rezeption.',final:'Das andere Zimmer ist nicht verfügbar. Bitte um eine andere Lösung.'},
'A2-M05':{brief:'Verstehe Arbeitsanweisungen, frage nach und erkläre einen Arbeitsablauf.',read:'Am ersten Arbeitstag beginnt die Arbeit um 8 Uhr. Die Pause ist von 12 bis 12:30 Uhr. Die Liste liegt in Raum 204.',listen:'Zuerst soll die Gästeliste kontrolliert werden. Danach soll eine E-Mail geschickt werden.',speak:'Erkläre, wie du eine einfache Aufgabe machst.',write:'Schreibe deinem Kollegen, was du schon gemacht hast und was noch fehlt.',final:'Die Reihenfolge der Aufgaben ändert sich. Bitte um Bestätigung und erkläre deinen neuen Plan.'},
'A2-M06':{brief:'Vergleiche Wohnungen, stelle Fragen und begründe deine Wahl.',read:'A: 55 m², 850 €, zentral, Balkon, kein Aufzug. B: 70 m², 780 €, weiter vom Zentrum, Erdgeschoss. C: 60 m², 820 €, ruhig, Balkon, Aufzug, keine Haustiere.',listen:'Anna findet A zentral, aber der fehlende Aufzug ist ein Problem. C ist ruhig und hat einen Aufzug.',speak:'Welche Wohnung würdest du wählen und warum?',write:'Schreibe einem Vermieter eine Nachricht mit Fragen zur Wohnung.',final:'Deine Wunschwohnung erlaubt keine Haustiere. Ändere deine Entscheidung und erkläre warum.'},
'A2-M07':{brief:'Vereinbare einen Termin bei einem Servicezentrum und bestätige die Details.',read:'Gesundheitszentrum Mitte: Mo–Fr 8–18 Uhr, Sa 9–13 Uhr. Für einen Termin braucht man Ausweis und Versicherungskarte.',listen:'Anna fragt nach Dienstag. 15 Uhr ist frei und sie bestätigt den Termin.',speak:'Erkläre, warum du einen Termin brauchst und wann du Zeit hast.',write:'Schreibe eine Termin-Nachricht.',final:'Der gewünschte Termin ist nicht frei. Wähle eine Alternative und bestätige sie.'},
'A2-M08':{brief:'Reklamiere höflich, erkläre das Problem und verhandle eine Lösung.',read:'Defekte Produkte können mit Kassenbon zurückgebracht werden. Ein Umtausch oder eine andere Lösung kann besprochen werden.',listen:'Ein Kunde hat einen kaputten Reißverschluss. Die gewünschte Farbe ist nicht verfügbar.',speak:'Erkläre ein Produktproblem und bitte um eine Lösung.',write:'Schreibe 70–90 Wörter an den Kundenservice.',final:'Die gewünschte Ersatzgröße ist ausverkauft. Schlage eine Alternative vor.'},
'A2-M09':{brief:'Mache Vorschläge, begründe deine Meinung und finde einen gemeinsamen Plan.',read:'Kino Samstag 19:30, 12 €. Park Sonntag 11 Uhr, kostenlos. Museum Samstag 14 Uhr, 8 €.',listen:'Lukas möchte ins Kino, Anna möchte wegen des Wetters lieber in den Park. Sie finden einen Kompromiss.',speak:'Schlage eine Wochenendaktivität vor und begründe sie.',write:'Schreibe deinem Freund einen Plan für das Wochenende.',final:'Der Park ist wegen des Wetters keine Option. Reagiere und finde gemeinsam eine Alternative.'},
'A2-M10':{brief:'Organisiere ein Fest, teile Aufgaben, vermittle Informationen und passe den Plan an.',read:'Das Jugendzentrum ist Samstag 18–22 Uhr geöffnet. Getränke sind vorhanden. Essen, Musik und Spiele müssen organisiert werden.',listen:'Lukas bringt Spiele, Anna bestellt Pizza und Maria kümmert sich um Getränke.',speak:'Erkläre den Organisationsplan.',write:'Schreibe eine Gruppennachricht mit Aufgaben und Zeiten.',final:'Die Musikbox funktioniert nicht. Schlage eine Alternative vor und verteile die Aufgabe neu.'},
'A2-M11':{brief:'Vergleiche Informationen, bewerte Optionen und treffe eine Entscheidung.',read:'Sportzentrum: 35 €, Schwimmbad, 10 Minuten mit dem Bus. Aktivzentrum: 45 €, Yoga, 5 Minuten zu Fuß. Freizeitclub: 25 €, Wandern, 20 Minuten mit dem Bus.',listen:'Anna möchte schwimmen und wenig bezahlen. Sie vergleicht zwei Angebote und entscheidet sich.',speak:'Erkläre die Unterschiede zwischen zwei Angeboten und deine Wahl.',write:'Schreibe 70–90 Wörter über deine Entscheidung.',final:'Neue Information: Deine erste Wahl ist diese Woche geschlossen. Entscheide neu und erkläre warum.'},
'A2-M12':{brief:'Erkläre eine Situation in einer klaren Nachricht: was passiert ist, warum und was jetzt passiert.',read:'Anna kann heute nicht zum Deutschkurs kommen. Ihr Sohn ist krank. Sie hat die Lehrerin informiert und bekommt die Aufgaben per E-Mail.',listen:'Paul kann morgen nicht pünktlich arbeiten, weil sein Zug Verspätung hat. Er hat schon mit Frau Keller gesprochen.',speak:'Erkläre einem Kollegen eine Änderung deines Plans.',write:'Schreibe 70–90 Wörter und erkläre Situation, Grund und nächsten Schritt.',final:'Die neue Zeit ist ebenfalls nicht möglich. Aktualisiere deine Nachricht und schlage eine Lösung vor.'},
'A2-M13':{brief:'Erledige mehrere Aufgaben in der Stadt, löse ein Problem und passe deinen Plan an.',read:'Postfiliale bis 18 Uhr. Bürgerbüro bis 16 Uhr. Café am Markt täglich ab 9 Uhr. Das Bürgerbüro ist 15 Minuten vom Bahnhof entfernt.',listen:'Das Café am Markt ist heute geschlossen. Ein anderes Café ist neben dem Bahnhof.',speak:'Erkläre die Reihenfolge deiner Aufgaben und begründe sie.',write:'Schreibe deinem Freund, was sich im Plan geändert hat.',final:'Du hast nur 60 Minuten und der Bus hat Verspätung. Priorisiere die Aufgaben, löse ein Problem und erkläre deinen neuen Plan.'},
'A2-M14':{brief:'Integrierte A2-Prüfung: Nutze bekannte Sprachmittel in einem neuen Kontext.',read:'Fotokurs: Dienstag 18 Uhr, 30 €, Bus 10 Minuten. Kochkurs: Mittwoch 19 Uhr, 40 €, zu Fuß 5 Minuten. Zeichenkurs: Samstag 11 Uhr, 25 €, Materialien inklusive.',listen:'Eine Person möchte einen Kurs besuchen, kann aber am Samstag nicht. Sie vergleicht Alternativen.',speak:'Wähle einen Kurs und erkläre deine Entscheidung.',write:'Schreibe eine Anmeldenachricht und stelle eine Frage.',final:'Deine erste Wahl ist ausgebucht. Reagiere, wähle eine Alternative, erkläre deine Entscheidung und gib die neue Information an eine andere Person weiter.'}
};

<script>
const M=window.DP_MISSIONS,C=window.DP_CONTENT;
C['A1-M01']={read:'Hallo! Ich heiße Mira. Ich komme aus der Türkei und wohne jetzt in Berlin. Ich bin 28 Jahre alt und lerne Deutsch.',listen:'Guten Tag, mein Name ist Tom. Ich komme aus Österreich. Ich arbeite in einem Café und spreche ein bisschen Englisch.',speak:'Stell dich vor: Wie heißt du? Woher kommst du? Wo wohnst du?',write:'Schreibe 4–5 Sätze über dich.',brief:'Stelle dich vor.'};
const SK=[['L','Hören','🎧','var(--L)','listen'],['S','Sprechen','🗣️','var(--S)','speak'],['R','Lesen','📖','var(--R)','read'],['W','Schreiben','✍️','var(--W)','write']];
const K='dp_v3';let S={lvl:'A1',p:{},xp:0,days:[],t:{d:'',xp:0},goal:50,name:'',pl:null,cd:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
S.cd=S.cd||{};const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sents=t=>(t.match(/[^.!?]+[.!?]*/g)||[]).map(s=>s.trim()).filter(Boolean);
const norm=s=>s.toLowerCase().replace(/[^a-zäöüß0-9\s]/g,' ').split(/\s+/).filter(Boolean);
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const clean=w=>w.replace(/[^A-Za-zÄÖÜäöüß]/g,'');
const keys=l=>M[l].map(m=>l+'-'+m[0]);
const done=(k,s)=>(S.p[k]||{})[s]!=null;
function say(t,r){try{if(window.AndroidTTS){window.AndroidTTS.speak(t,r||.9);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=r||.9;speechSynthesis.speak(u)}catch(e){}}
function rec(cb){if(window.AndroidSTT){window.onSTT=(tx,e)=>{window.onSTT=null;cb(tx||null)};window.AndroidSTT.start();return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return cb(null);try{const r=new R();r.lang='de-DE';r.onresult=e=>cb(e.results[0][0].transcript);r.onerror=()=>cb(null);r.start()}catch(e){cb(null)}}
function sim(a,b){const A=norm(a),B=norm(b);if(!B.length)return 0;const u=[...A];let h=0;B.forEach(w=>{const i=u.indexOf(w);if(i>-1){h++;u.splice(i,1)}});return h/B.length}
let P=null,tab='home',cur=null,Q=null,end=null;
function build(k,s){const c=C[k],l=k.slice(0,2),I=[];
 if(s==='R'){const pool=[...new Set(Object.keys(C).filter(x=>x.startsWith(l)).flatMap(x=>C[x].read.split(/\s+/).map(clean)).filter(w=>w.length>=4))];
  sents(c.read).slice(0,4).forEach(t=>{const tk=t.split(/\s+/),i=tk.reduce((b,w,j)=>j>0&&clean(w).length>clean(tk[b]).length?j:b,0),a=clean(tk[i]);if(a.length<4)return;const o=shuf([a,...shuf(pool.filter(w=>w.toLowerCase()!==a.toLowerCase())).slice(0,2)]);const q=tk.map((w,j)=>j===i?'_____':w).join(' ');I.push({y:'cloze',q,a,o})})}
 if(s==='L')sents(c.listen).slice(0,3).forEach(t=>I.push({y:'dict',t}));
 if(s==='S'){sents(c.read).slice(0,2).forEach(t=>I.push({y:'shadow',t}));I.push({y:'free',sp:1,t:c.speak})}
 if(s==='W'){sents(c.read).slice(0,2).forEach(t=>I.push({y:'order',t,w:shuf(t.replace(/[.!?]$/,'').split(/\s+/))}));I.push({y:'free',t:c.write,m:c.read})}
 return I}
function go(a,v,x){
 if(a==='pl'){P={i:0,a:[]};end=null;Q=null}
 if(a==='plx')P=null;
 if(a==='pa')P.a[P.i]=v;
 if(a==='pn'){if(!PL[P.i].opts){const e=document.getElementById('pt');P.a[P.i]=e?e.value:''}
  if(P.i>=PL.length-1){S.pl=plres();S.lvl=['Listening','Reading','Speaking','Writing'].every(s=>S.pl[s]==='A2')?'A2':'A1';P=null;tab='plres'}else P.i++}
 if(a==='plok')tab='home';
 if(a==='cd')S.cd[v]=!S.cd[v];
 if(a==='tab'){P=null;tab=v;cur=null;Q=null;end=null}
 if(a==='lvl')S.lvl=v;
 if(a==='m'){cur=v;tab='unit'}
 if(a==='start'){const[k,s]=v.split('|');Q={k,s,I:build(k,s),i:0,sc:[],st:{}};end=null}
 if(a==='quit'){Q=null}
 if(a==='goal')S.goal=+v;
 if(a==='reset'&&confirm('Tüm ilerleme silinsin mi?'))S={lvl:'A1',p:{},xp:0,days:[],t:{d:'',xp:0},goal:50,name:''};
 if(a==='next')adv(v);
 if(a==='cont'){const l=S.lvl;for(const k of keys(l))for(const s of SK)if(!done(k,s[0])){return go('start',k+'|'+s[0])}}
 if(a==='skill'){const k=keys(S.lvl).find(k=>!done(k,v))||keys(S.lvl)[0];return go('start',k+'|'+v)}
 if(a==='play')say(Q.I[Q.i].t,x);
 if(a==='pick'){const it=Q.I[Q.i];Q.st.pick=v;Q.st.ok=it.o[v]===it.a;Q.st.fin=1}
 if(a==='dict'){const it=Q.I[Q.i];Q.st.val=document.getElementById('ti').value;Q.st.s=sim(Q.st.val,it.t);Q.st.fin=1}
 if(a==='mic'){Q.st.busy=1;render();rec(r=>{Q.st.busy=0;if(r==null)Q.st.nosr=1;else{Q.st.heard=r;Q.st.s=sim(r,Q.I[Q.i].t);Q.st.fin=1}render()});return}
 if(a==='self'){Q.st.s=+v;Q.st.fin=1}
 if(a==='add'){(Q.st.a=Q.st.a||[]).push(v)}
 if(a==='clr')Q.st.a=[];
 if(a==='chk'){const it=Q.I[Q.i];Q.st.s=(Q.st.a||[]).join(' ')===it.t.replace(/[.!?]$/,'')?1:0;Q.st.fin=1}
 if(a==='fin'){const t=document.getElementById('fx').value;Q.st.val=t;const it=Q.I[Q.i];
   if(it.sp)Q.st.s=document.getElementById('sc').checked?1:.5;
   else{const n=norm(t),w=n.length,ss=sents(t).length,kw=sim(t,it.m);Q.st.chk=[[w>=15,'En az 15 kelime ('+w+')'],[ss>=3,'En az 3 cümle ('+ss+')'],[/^[A-ZÄÖÜ]/.test(t.trim()),'Büyük harfle başla'],[/[.!?]\s*$/.test(t.trim()),'Noktalama ile bitir'],[kw>=.2,'Konuya uygun kelimeler']];Q.st.s=Q.st.chk.filter(c=>c[0]).length/5}
   Q.st.fin=1}
 render();scrollTo(0,0)}
function adv(){Q.sc.push(Q.st.s??0);Q.st={};Q.i++;if(Q.i>=Q.I.length){const avg=Q.sc.reduce((a,b)=>a+b,0)/Q.sc.length,xp=Math.round(10+20*avg);const o=(S.p[Q.k]||{})[Q.s]||0;(S.p[Q.k]=S.p[Q.k]||{})[Q.s]=Math.max(o,avg);S.xp+=xp;if(S.t.d!==today())S.t={d:today(),xp:0};S.t.xp+=xp;if(!S.days.includes(today()))S.days.push(today());end={avg,xp,k:Q.k,s:Q.s};Q=null}save();render()}
function streak(){let n=0,d=new Date();if(!S.days.includes(today()))d.setDate(d.getDate()-1);while(S.days.includes(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
const pct=(l,s)=>keys(l).filter(k=>done(k,s)).length/keys(l).length;
function home(){const tx=S.t.d===today()?S.t.xp:0,g=Math.min(1,tx/S.goal),R=34,Cc=2*Math.PI*R;
 return `<div class="cd hero"><div class="row sp"><div><h1>Hallo${S.name?', '+esc(S.name):''}! 👋</h1><div class="mu">🔥 ${streak()} günlük seri · ⭐ ${S.xp} XP</div></div>
 <svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="${R}" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="9"/><circle cx="42" cy="42" r="${R}" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="${Cc}" stroke-dashoffset="${Cc*(1-g)}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">${tx}/${S.goal}</text></svg></div>
 <button class="btn w" onclick="go('cont')">Devam et →</button></div>
 <div class="seg">${['A1','A2'].map(l=>`<button class="${l===S.lvl?'on':''}" onclick="go('lvl','${l}')">${l}</button>`).join('')}</div>
 <div class="mu">CEFR ${S.lvl} · ${LN[S.lvl]}</div>${S.pl?'':`<div class="cd"><b>Seviyeni bilmiyor musun?</b><div class="mu">Kısa CEFR yerleştirme testi (11 soru)</div><button class="btn s" onclick="go('pl')">Testi başlat</button></div>`}<h2>4 Beceri</h2><div class="g2">${SK.map(s=>`<button class="sk" style="background:${s[3]}" onclick="go('skill','${s[0]}')"><span class="e">${s[2]}</span><b>${s[1]}</b><div class="bar"><i style="width:${pct(S.lvl,s[0])*100}%"></i></div></button>`).join('')}</div>`}
function units(){return `<h1>Üniteler</h1><div class="seg">${['A1','A2'].map(l=>`<button class="${l===S.lvl?'on':''}" onclick="go('lvl','${l}')">${l}</button>`).join('')}</div>`+M[S.lvl].map(m=>{const k=S.lvl+'-'+m[0];return `<button class="m" onclick="go('m','${k}')"><span class="n">${m[0].slice(1)}</span><span><b>${esc(m[1])}</b><br><span class="mu">${esc(m[2])}</span><br>${SK.map(s=>`<span class="dot" style="${done(k,s[0])?'background:'+s[3]:''}"></span>`).join('')}</span></button>`}).join('')}
function unit(){const m=M[cur.slice(0,2)].find(x=>x[0]===cur.slice(3));return `<button class="back" onclick="go('tab','units')">← Üniteler</button><h1>${esc(m[1])}</h1><div class="mu">CEFR ${cur.slice(0,2)} · ${esc(m[3])}</div><div>${(window.DP_CAN_DO[cur]||[]).map(c=>`<span class="mu">[${c}] </span>`).join('')}</div>`+SK.map(s=>{const v=(S.p[cur]||{})[s[0]];return `<button class="m" onclick="go('start','${cur}|${s[0]}')"><span class="n" style="background:${s[3]};color:#fff">${s[2]}</span><span><b>${s[1]}</b><br><span class="mu">${v!=null?'En iyi: %'+Math.round(v*100):'Henüz yapılmadı'}</span></span></button>`}).join('')}
function me(){return `<h1>Ben</h1><div class="cd"><label class="mu">Adın</label><input value="${esc(S.name)}" oninput="S.name=this.value;save()"></div><div class="cd"><h2>Günlük hedef</h2><div class="seg">${[30,50,80].map(g=>`<button class="${g===S.goal?'on':''}" onclick="go('goal',${g})">${g} XP</button>`).join('')}</div></div>
 <button class="btn s" onclick="go('pl')">🧭 CEFR yerleştirme testi</button>${S.pl?`<div class="cd"><h2>Test sonucu</h2>${Object.entries(S.pl).map(([s,l])=>`<div class="row sp mu"><span>${TR[s]}</span><b>${l}</b></div>`).join('')}</div>`:''}
 ${['A1','A2'].map(l=>{const z=lvlStat(l);return `<div class="cd"><h2>CEFR ${l} · ${LN[l]} ${z.c===1&&z.s>=.7?'🏅':''}</h2><div class="mu">Tamamlama %${Math.round(z.c*100)} · Ortalama başarı %${Math.round(z.s*100)}</div><p class="mu">Yapabildiklerini işaretle:</p>${CD[l].map((c,i)=>`<label class="chk"><input type="checkbox" style="width:22px;flex:none" ${S.cd[l+i]?'checked':''} onchange="go('cd','${l+i}')"><span>${c}</span></label>`).join('')}</div>`}).join('')}
 ${['A1','A2'].map(l=>`<div class="cd"><h2>${l}</h2>${SK.map(s=>`<div class="row sp mu"><span>${s[2]} ${s[1]}</span><b>${Math.round(pct(l,s[0])*100)}%</b></div><div class="bar2"><i style="width:${pct(l,s[0])*100}%"></i></div>`).join('')}</div>`).join('')}
 <div class="cd mu">İlerleme yalnızca bu cihazın tarayıcısında saklanır.</div><button class="btn s" onclick="go('reset')">İlerlemeyi sıfırla</button>`}
function quiz(){const it=Q.I[Q.i],st=Q.st,sk=SK.find(s=>s[0]===Q.s);let b='';
 const next=st.fin?`<button class="btn" onclick="go('next')">${Q.i+1>=Q.I.length?'Bitir ✓':'Devam →'}</button>`:'';
 if(it.y==='cloze')b=`<p class="mu">Boşluğu doldur</p><p class="de">${esc(it.q)}</p>`+it.o.map((o,i)=>`<button class="opt ${st.fin?(o===it.a?'ok':st.pick===i?'no':''):''}" ${st.fin?'disabled':''} onclick="go('pick',${i})">${esc(o)}</button>`).join('')+(st.fin?`<p class="${st.ok?'g':'r'}">${st.ok?'Harika! 🎉':'Doğrusu: '+esc(it.a)}</p>`:'')+`<div class="mu">Metin: ${esc(C[Q.k].read)}</div>`;
 else if(it.y==='dict')b=`<p class="mu">Dinle ve duyduğunu yaz</p><div class="row"><button class="btn" onclick="go('play',0,.9)">▶️ Dinle</button><button class="btn s" onclick="go('play',0,.55)">🐢 Yavaş</button></div><input id="ti" autocapitalize="off" value="${esc(st.val||'')}" ${st.fin?'disabled':''} placeholder="Almanca yaz…">`+(st.fin?`<p class="${st.s>=.8?'g':'r'}">%${Math.round(st.s*100)}</p><p class="de">${esc(it.t)}</p>`:`<button class="btn" onclick="go('dict')">Kontrol et</button>`);
 else if(it.y==='shadow')b=`<p class="mu">Dinle, sonra yüksek sesle tekrar et</p><p class="de">${esc(it.t)}</p><button class="btn s" onclick="go('play',0,.85)">🔊 Dinle</button>`+(st.fin?(st.heard?`<p>Duyulan: <i>${esc(st.heard)}</i></p><p class="${st.s>=.7?'g':'r'}">%${Math.round(st.s*100)}</p>`:`<p class="g">Kaydedildi 👍</p>`):st.nosr?`<p class="mu">Ses tanıma çalışmadı. Kendin değerlendir:</p><div class="row"><button class="btn s" onclick="go('self',1)">👍 İyiydi</button><button class="btn s" onclick="go('self',.5)">🔁 Biraz</button></div>`:`<button class="btn" ${st.busy?'disabled':''} onclick="go('mic')">${st.busy?'Dinliyorum…':'🎤 Konuş'}</button>`);
 else if(it.y==='order')b=`<p class="mu">Cümleyi doğru sıraya diz</p><div class="ans">${(st.a||[]).map(w=>`<span class="chip">${esc(w)}</span>`).join('')}</div><div>${it.w.map((w,i)=>`<button class="chip ${(st.a||[]).filter(x=>x===w).length>=it.w.filter(x=>x===w).length?'u':''}" onclick="go('add','${w.replace(/'/g,"\\'")}')">${esc(w)}</button>`).join('')}</div>`+(st.fin?`<p class="${st.s?'g':'r'}">${st.s?'Doğru! 🎉':'Doğrusu: '+esc(it.t)}</p>`:`<div class="row"><button class="btn s" onclick="go('clr')">Sıfırla</button><button class="btn" onclick="go('chk')">Kontrol</button></div>`);
 else b=`<p class="de">${esc(it.t)}</p>`+(it.sp?`<button class="btn s" onclick="go('play',0,.85)">🔊 Dinle</button><label class="chk"><input type="checkbox" id="sc" style="width:22px"> Yüksek sesle cevap verdim</label><textarea id="fx" style="display:none"></textarea>`+(st.fin?'':`<button class="btn" onclick="go('fin')">Tamam</button>`):`<textarea id="fx" placeholder="Almanca yaz…" ${st.fin?'disabled':''}>${esc(st.val||'')}</textarea>`+(st.fin?`<div class="cd">${st.chk.map(c=>`<div class="${c[0]?'g':'r'}">${c[0]?'✓':'✗'} ${c[1]}</div>`).join('')}</div>`:`<button class="btn" onclick="go('fin')">Değerlendir</button>`));
 return `<div class="row sp"><button class="back" onclick="go('quit')">✕ Çık</button><span class="mu">${sk[2]} ${sk[1]} · ${Q.k.slice(0,2)} · ${Q.i+1}/${Q.I.length}</span></div><div class="bar2"><i style="width:${Q.i/Q.I.length*100}%"></i></div><div class="cd">${b}</div>${next}`}
function fin(){const st=Math.round(end.avg*2.99+.01)||1;return `<div class="cd hero" style="text-align:center"><div style="font-size:56px">${'⭐'.repeat(Math.max(1,Math.min(3,Math.round(end.avg*3))))}</div><h1>${end.avg>.8?'Sehr gut!':end.avg>.5?'Gut gemacht!':'Weiter so!'}</h1><div class="mu">%${Math.round(end.avg*100)} · +${end.xp} XP</div></div><button class="btn" onclick="go('m','${end.k}')">Üniteye dön</button><button class="btn s" onclick="go('cont')">Sonraki alıştırma →</button>`}
function render(){document.getElementById('app').innerHTML=Q?quiz():P?plview():end?fin():tab==='plres'?plend():tab==='home'?home():tab==='units'?units():tab==='unit'?unit():me();
 document.getElementById('nav').innerHTML=[['home','🏠','Ana'],['units','📚','Üniteler'],['me','👤','Ben']].map(t=>`<button class="${t[0]===tab||(t[0]==='units'&&tab==='unit')?'on':''}" onclick="go('tab','${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('')}
const PL=[
{skill:'Reading',level:'A1',q:'Anna wohnt jetzt in Köln. Wo wohnt Anna?',opts:['Hamburg','Köln','Bonn'],a:1},
{skill:'Reading',level:'A2',q:'Which sentence best shows a reason? „Ich fahre mit dem Bus, weil der Zug teuer ist.“',opts:['The bus is expensive.','The train is expensive.','The train is fast.'],a:1},
{skill:'Listening',level:'A1',q:'Wo wohnt Daniel jetzt?',speech:'Hallo, ich heiße Daniel. Ich komme aus Bonn. Jetzt wohne ich in Berlin. Ich arbeite an der Universität.',opts:['Bonn','Berlin','Köln'],a:1},
{skill:'Listening',level:'A2',q:'Warum kann Anna morgen nicht um acht Uhr anfangen?',speech:'Mein Zug hat heute Abend Verspätung. Deshalb komme ich spät nach Hause. Morgen kann ich nicht um acht Uhr anfangen. Ich komme um zehn Uhr.',opts:['Sie ist im Urlaub.','Ihr Zug hat Verspätung.','Sie arbeitet am Nachmittag.'],a:1},
{skill:'Writing',level:'A1',q:'Write 2–3 sentences in German: introduce yourself with your name and city.',free:true},
{skill:'Writing',level:'A2',q:'Write 2–3 sentences in German: explain why you cannot come to an appointment and suggest another time.',free:true},
{skill:'Speaking',level:'A1',q:'Say in German: introduce yourself with your name, city and work/study.',speechPrompt:true},
{skill:'Speaking',level:'A2',q:'Speak or type in German for 30–60 seconds: describe your daily routine and explain one preference.',speechPrompt:true},
{skill:'Interaction',level:'A1',q:'You are in a café. Ask for a coffee and ask the price.',free:true},
{skill:'Interaction',level:'A2',q:'You planned to meet a friend at 18:00, but you cannot come then. Explain the problem and suggest another time.',free:true},
{skill:'Mediation',level:'A2',q:'Your friend needs a cheap weekend activity. Read: „Museum: 8 €. Samstag 14 Uhr. Park: kostenlos. Sonntag 11 Uhr.“ Tell your friend the useful options in German.',free:true}];
const LN={A1:'Başlangıç',A2:'Temel'},TR={Listening:'🎧 Hören',Reading:'📖 Lesen',Speaking:'🗣️ Sprechen',Writing:'✍️ Schreiben',Interaction:'💬 Interaktion',Mediation:'🔁 Aktarma'};
const CD={A1:['Yavaş ve net konuşulan kısa, basit cümleleri anlayabilirim. (Hören)','Kısa, basit metinlerde tanıdık kelime ve cümleleri anlayabilirim. (Lesen)','Kendimi tanıtabilir, basit sorular sorup yanıtlayabilirim. (Sprechen)','Formlara bilgi yazabilir, kısa basit cümleler kurabilirim. (Schreiben)','Karşım yavaş konuşursa kafede ya da mağazada basit bir konuşma yapabilirim. (Interaktion)'],
A2:['Günlük konulardaki kısa, açık konuşmaların ana fikrini anlayabilirim. (Hören)','Kısa mesaj ve ilanlarda gerekli bilgiyi bulabilirim. (Lesen)','Günlüğümü, geçmişimi ve tercihlerimi basit cümlelerle anlatabilirim. (Sprechen)','Kısa mesaj ve davet yazıp bir neden belirtebilirim. (Schreiben)','Randevu ve seyahat gibi tanıdık durumlarda kısa konuşmaları yönetebilirim. (Interaktion)','Basit bir bilgiyi bir arkadaşıma kendi cümlelerimle aktarabilirim. (Aktarma)']};
function plres(){const L={};PL.forEach((q,i)=>{const a=P.a[i];const ok=q.opts?a===q.a:norm(a||'').length>=(q.level==='A1'?4:8);const v=L[q.skill]=L[q.skill]||{A1:0,A2:0};v[q.level]=ok?1:0});return Object.fromEntries(Object.entries(L).map(([s,v])=>[s,v.A2?'A2':v.A1?'A1':'Pre-A1']))}
function plview(){const q=PL[P.i];return `<div class="row sp"><button class="back" onclick="go('plx')">✕ Çık</button><span class="mu">${P.i+1}/${PL.length} · ${TR[q.skill]} · ${q.level}</span></div><div class="bar2"><i style="width:${P.i/PL.length*100}%"></i></div><div class="cd"><p style="font-size:18px">${esc(q.q)}</p>${q.speech?`<button class="btn s" onclick="say(PL[P.i].speech,.85)">🔊 Dinle</button>`:''}${q.opts?q.opts.map((o,n)=>`<button class="opt ${P.a[P.i]===n?'ok':''}" onclick="go('pa',${n})">${esc(o)}</button>`).join(''):`<textarea id="pt" placeholder="Almanca yaz…">${esc(P.a[P.i]||'')}</textarea>`}<button class="btn" onclick="go('pn')">${P.i===PL.length-1?'Bitir ✓':'Devam →'}</button></div>`}
function plend(){return `<h1>CEFR profilin</h1><div class="cd">${Object.entries(S.pl).map(([s,l])=>`<div class="row sp"><span>${TR[s]}</span><b>${l}</b></div>`).join('')}</div><p class="mu">Bu kısa test kaba bir tahmindir; resmî sınav sonucu yerine geçmez.</p><button class="btn" onclick="go('plok')">${S.lvl} ile başla →</button>`}
function lvlStat(l){const ks=keys(l);let c=0,sc=0;ks.forEach(k=>SK.forEach(s=>{if(done(k,s[0])){c++;sc+=S.p[k][s[0]]}}));const n=ks.length*4;return {c:c/n,s:c?sc/c:0}}
render();
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})</script></body></html>
